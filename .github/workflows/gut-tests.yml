name: GUT Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-gut-tests:
    name: Run GUT Tests (Godot 4.3)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Verify Godot installation
        run: godot --version

      # One runner, one invocation. run_tests.sh imports the project, picks the
      # bundled 4.3 binary (falling back to the `godot` installed above), and
      # propagates GUT's exit code. Do not inline a godot call here: when CI and
      # the script drift, CI is the copy that stops telling the truth.
      #
      # In particular this must never be run with `-d`. Under the debugger a
      # runtime error in any test breaks, finds no stdin, and terminates the
      # process with exit code 0 — before GUT prints its totals. That is not a
      # hypothetical: it hid a red main behind a green check.
      - name: Run GUT tests
        env:
          GODOT_DISABLE_LEAK_CHECKS: "1"
        run: ./run_tests.sh
